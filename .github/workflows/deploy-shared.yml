name: Deploy (shared)

# FIXED — the reusable deploy pipeline, called by deploy-prod.yml and
# deploy-staging.yml. SHIPPED DISABLED: the builder worker runs these same gates and
# `scripts/deploy.js` from the merged commit on every tier, with credentials minted per job
# by the control plane — no cluster credentials live in any app repo. The wrappers
# gate on the repository variable DEPLOY_WORKFLOWS_ENABLED, which the control plane sets on
# the Builder tier after the human has stored the CLI_* secrets. Until then this file
# is documentation of the gate sequence and the fallback for hand deploys.
#
# Every gate here caught a real incident in an earlier app.
# Two scripts this calls land in the deploy work package: scripts/deploy.js (build-before-
# deploy guard, refuses a localhost CLI_TARGET) and scripts/build-stamp.js (the ONE reader
# of GET /build: six fresh-connection samples per node, two polls; exit 3 = a stranger's
# sha, 4 = split or unusable, 6 = restart job pending, 7 = fatal).

on:
  workflow_call:
    inputs:
      target:
        description: "'prod' or 'staging' — selects which CLI_TARGET secret set deploys (staging exists on the Builder tier only)"
        required: true
        type: string
      public_url:
        description: "Public origin of this target, no trailing slash"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 30, not 15: npm ci 1–8 min on a bad night, the CLI install,
    # `harper deploy` ~4.5 min, then a 60-poll fleet wait. A job cancelled by its own
    # timeout is red with no diagnosis while the code has already landed.
    timeout-minutes: 30
    env:
      # Job-level `env:` may only read github, needs, strategy, matrix, vars, secrets and
      # inputs — `runner` is a STEP-level context. Two `${{ runner.temp }}` entries here made
      # the file invalid, and GitHub validates every workflow file on every push: the invalid
      # file produced a zero-job `failure` run named after itself on every commit, on every
      # branch, and (through the `uses:` above) on deploy-prod.yml's own push run. The
      # fleet files are named from $RUNNER_TEMP inside the steps that use them, the way the
      # deploy log below already was.
      BASE: ${{ inputs.public_url }}
    steps:
      - name: Refuse to run unless deploy workflows are enabled for this repo
        # Belt and braces with the wrappers' job-level `if`. A reusable workflow called
        # from a copy of a wrapper that lost its guard must still not deploy.
        env:
          ENABLED: ${{ vars.DEPLOY_WORKFLOWS_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "❌ DEPLOY_WORKFLOWS_ENABLED is not 'true' for this repository — deploy workflows ship disabled."
            echo "   The builder worker deploys this app. On the Builder tier the control plane sets the variable."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install Harper CLI
        # The PACKAGE is `harper`, not `harperdb`, and the range this line used to carry did
        # not resolve at all: measured 2026-10-14, `npm view 'harperdb@^5.2' version` answers
        # `E404 — No match found for version ^5.2`, because `harperdb` stops at 4.7.41 and
        # Harper's 5.x line is published under the other name. The BINARY it provides is
        # `harper` and only `harper` — `harper@5.3.1`'s own `bin` is `{ harper: … }` where
        # `harperdb@4.7.41` declared both names — so repointing this line without repointing
        # `scripts/deploy.js`'s spawn moves the failure to the deploy rather than fixing it.
        # `^5.2` is the range `package.json`'s `engines` already declares, so the two records
        # of which Harper this tree wants cannot disagree.
        run: npm i -g harper@^5.2

      - name: Validate critical secrets
        # A repo secret set to a placeholder ('-', '', 'TODO') deploys green and breaks at
        # runtime (an earlier app: four secrets were '-'). Reads env vars directly,
        # prints char counts on success AND failure, never the values. Required keys must
        # match; optional keys must match only when set, because Trial apps carry no Stripe,
        # Google or Resend until the founder connects them.
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_APP_URL: ${{ inputs.public_url }}
          CLI_TARGET: ${{ inputs.target == 'staging' && secrets.STAGE_CLI_TARGET || secrets.CLI_TARGET }}
          CLI_TARGET_USERNAME: ${{ inputs.target == 'staging' && secrets.STAGE_CLI_TARGET_USERNAME || secrets.CLI_TARGET_USERNAME }}
          CLI_TARGET_PASSWORD: ${{ inputs.target == 'staging' && secrets.STAGE_CLI_TARGET_PASSWORD || secrets.CLI_TARGET_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -e
          fail=0
          check() {
            local key="$1" pattern="$2" val
            val="$(printenv "$key" || true)"
            if [ -z "$val" ] || ! printf '%s' "$val" | grep -qE "$pattern"; then
              printf '  FAIL %-26s %d chars, does not match %s\n' "$key" "${#val}" "$pattern"; fail=1
            else
              printf '  ok   %-26s %d chars\n' "$key" "${#val}"
            fi
          }
          optional() {
            local key="$1" pattern="$2" val
            val="$(printenv "$key" || true)"
            if [ -z "$val" ]; then printf '  --   %-26s not set (optional)\n' "$key"; return; fi
            check "$key" "$pattern"
          }
          check SESSION_SECRET        '^.{32,}$'
          check PUBLIC_APP_URL        '^https://'
          check CLI_TARGET            '^https://'
          check CLI_TARGET_USERNAME   '^.+$'
          check CLI_TARGET_PASSWORD   '^.{8,}$'
          optional GOOGLE_CLIENT_ID     '\.apps\.googleusercontent\.com$'
          optional GOOGLE_CLIENT_SECRET '^GOCSPX-'
          optional RESEND_API_KEY       '^re_'
          optional RESEND_WEBHOOK_SECRET '^whsec_'
          optional TURNSTILE_SECRET_KEY '^0x'
          # The USER's own Stripe credentials. Both are prefix-checked
          # rather than length-checked, because the single likeliest paste error is the webhook
          # signing secret in the key field and the other way round — and Stripe refuses that with
          # the same 401 as a revoked key, so only a local check can tell them apart.
          optional STRIPE_SECRET_KEY     '^(sk|rk)_(test|live)_'
          optional STRIPE_WEBHOOK_SECRET '^whsec_'
          # Rule 15: never deploy against localhost — it strips devDependencies in place.
          if printf '%s' "$(printenv CLI_TARGET)" | grep -qE '://(localhost|127\.)'; then
            echo "  FAIL CLI_TARGET resolves to localhost"; fail=1
          fi
          if [ $fail -ne 0 ]; then
            echo; echo "❌ One or more secrets look like placeholders (or empty). Fix them in Settings → Secrets and re-run."
            exit 1
          fi

      - name: Write CONFIG.env from secrets
        # Runners are ephemeral; this file lives for the length of this job. Every key is
        # named TWICE — here in env: and in the for-list below — and pr-check.yml fails a PR
        # where the two lists disagree (env-only never reaches CONFIG.env; for-only writes an
        # empty value). The builder worker writes the same file from per-job credentials.
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_APP_URL: ${{ inputs.public_url }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Not a secret: the account tier lib/plan.js reads its quotas from (trial|tinkerer|builder).
          IMMENSUS_TIER: ${{ vars.IMMENSUS_TIER }}
        run: |
          {
            for k in SESSION_SECRET PUBLIC_APP_URL \
                     GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     RESEND_API_KEY RESEND_WEBHOOK_SECRET EMAIL_FROM \
                     TURNSTILE_SECRET_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
                     IMMENSUS_TIER; do
              printf '%s=%s\n' "$k" "$(printenv "$k")"
            done
          } > CONFIG.env

      - name: Stamp this build into CONFIG.env
        # Deploy time is the only moment the sha is knowable: `harper deploy` ships a
        # DIRECTORY, not a repo — and the directory is the CLI's own `process.cwd()`
        # (measured in `harper@5.3.1`'s `bin/cliOperations.js`), never an argument.
        # routes/build.js serves these at GET /build, and
        # build-stamp.js reads them back per node. A separate step from the secrets so the
        # two-list guard above does not have to know about run metadata.
        run: |
          {
            printf 'BUILD_ENV=%s\n'         "${{ inputs.target }}"
            printf 'BUILD_SHA=%s\n'         "$GITHUB_SHA"
            printf 'BUILD_REF=%s\n'         "$GITHUB_REF_NAME"
            printf 'BUILD_RUN_ID=%s\n'      "$GITHUB_RUN_ID"
            printf 'BUILD_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'BUILD_TIME=%s\n'        "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> CONFIG.env
          echo "stamping ${{ inputs.target }} as $GITHUB_REF_NAME @ ${GITHUB_SHA:0:7} (run $GITHUB_RUN_ID)"

      - name: Write .env for the Harper CLI
        env:
          CLI_TARGET: ${{ inputs.target == 'staging' && secrets.STAGE_CLI_TARGET || secrets.CLI_TARGET }}
          CLI_TARGET_USERNAME: ${{ inputs.target == 'staging' && secrets.STAGE_CLI_TARGET_USERNAME || secrets.CLI_TARGET_USERNAME }}
          CLI_TARGET_PASSWORD: ${{ inputs.target == 'staging' && secrets.STAGE_CLI_TARGET_PASSWORD || secrets.CLI_TARGET_PASSWORD }}
        run: |
          {
            printf 'CLI_TARGET=%s\n' "$CLI_TARGET"
            printf 'CLI_TARGET_USERNAME=%s\n' "$CLI_TARGET_USERNAME"
            printf 'CLI_TARGET_PASSWORD=%s\n' "$CLI_TARGET_PASSWORD"
          } > .env

      - name: Build the frontend
        # web/ is BUILT and gitignored; a deploy without it ships no app.
        # scripts/deploy.js re-checks that web/index.html exists and is newer than src/.
        run: npm run build

      - name: Discover the fleet and capture its pre-deploy baseline
        # An environment is not one origin: a Fabric cluster is N nodes behind GTM, any one
        # client reaches one of them, and the CLI returns before the others have rolled.
        # Node list from Harper's own
        # cluster_status; per-node processStartedAt baseline so "rolled" is provable.
        run: |
          set -e
          node scripts/build-stamp.js --discover --ops-env .env --out "$RUNNER_TEMP/nodes.json"
          node scripts/build-stamp.js --capture-baseline --nodes "$RUNNER_TEMP/nodes.json" --out "$RUNNER_TEMP/baseline.json"

      - name: Deploy
        id: deploy
        # The Harper CLI logs errors but exits 0, and a rolling restart resets the CLI's own
        # TLS connection BY SUCCEEDING (`ECONNRESET` four minutes in, on a
        # deploy that had landed). So the log is classified for the record but is NOT the
        # verdict; the wait step's per-node stamp convergence is.
        run: |
          set -o pipefail
          node scripts/deploy.js 2>&1 | tee "$RUNNER_TEMP/deploy.log" || true
          if grep -qiE 'ENOTFOUND|ECONNREFUSED|401|403|Unauthorized' "$RUNNER_TEMP/deploy.log"; then
            echo "::warning::deploy log contains an error marker — the wait step below decides whether anything landed"
          fi
          job="$(grep -oE 'job[_ ]?id[": ]+[0-9a-f-]{8,}' "$RUNNER_TEMP/deploy.log" | grep -oE '[0-9a-f-]{8,}$' | head -1 || true)"
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Wait for every node to serve this build
        id: wait
        # Rule 13: six agreeing fresh-connection samples per node on two polls, from a
        # process that started after that node's baseline, and Harper's restart job COMPLETE
        # when the CLI printed one. Exit 3 (a stranger's sha) fails at once — a takeover does
        # not heal by waiting. 4 and 6 are transient for 10–30 s after a roll and are polled.
        env:
          JOB: ${{ steps.deploy.outputs.job }}
        run: |
          set -e
          for i in $(seq 1 60); do
            rc=0
            node scripts/build-stamp.js --fleet --nodes "$RUNNER_TEMP/nodes.json" --baseline "$RUNNER_TEMP/baseline.json" \
              --expect "$GITHUB_SHA" --expect-run "$GITHUB_RUN_ID" --expect-attempt "$GITHUB_RUN_ATTEMPT" \
              ${JOB:+--job "$JOB" --ops-env .env} --quiet || rc=$?
            case "$rc" in
              0) echo "✅ every node serves ${GITHUB_SHA:0:7} to new connections (poll $i)"; exit 0 ;;
              3|5|7) echo "❌ build-stamp rc=$rc — not retryable (3 stranger's build, 5 usage, 7 restart failed)"; exit 1 ;;
              *) echo "  poll $i/60: rc=$rc (not converged yet)"; sleep 6 ;;
            esac
          done
          echo "❌ fleet did not converge on ${GITHUB_SHA:0:7} within the wait budget"
          exit 1

      - name: Smoke test — endpoints
        # One retry after 3 s, only on 5xx/000 (transient); a wrong-but-valid status is never
        # transient and fails on the first probe. GET only for anything static — Harper's
        # static plugin answers HEAD with 404 (rule 12). The app's own page routes come
        # from routes-manifest.json when the builder has generated one; the fixed rows below
        # are the template's own surface.
        run: |
          set -e
          probe() { curl -sk -o /dev/null -w '%{http_code}' -X "$1" --max-time 10 -- "${BASE}$2" || echo 000; }
          checks="$(printf '%s\n' \
            'GET / 200' \
            'GET /build 200' \
            'GET /web/index.html 200' \
            'GET /AuthApi/me 200' \
            'GET /Bootstrap/ 200')"
          if [ -f routes-manifest.json ]; then
            extra="$(node -e "for (const r of JSON.parse(require('fs').readFileSync('routes-manifest.json','utf8')).routes||[]) if (!r.includes(':') && !r.includes('*')) console.log('GET ' + r + ' 200')")"
            checks="$(printf '%s\n%s' "$checks" "$extra")"
          fi
          fail=0
          while read -r method path want; do
            [ -n "$method" ] || continue
            got=$(probe "$method" "$path")
            if [ "$got" != "$want" ] && { [ "$got" = 000 ] || [ "${got:0:1}" = 5 ]; }; then sleep 3; got=$(probe "$method" "$path"); fi
            if [ "$got" = "$want" ]; then printf '  ok   %-5s %-40s %s\n' "$method" "$path" "$got"
            else printf '  FAIL %-5s %-40s got %s want %s\n' "$method" "$path" "$got" "$want"; fail=1; fi
          done <<< "$checks"
          [ $fail -eq 0 ]

      - name: Smoke test — no WWW-Authenticate on 403 endpoints
        # Rule 20: a 401/403 carrying WWW-Authenticate: Basic pops the browser's dialog.
        run: |
          set -e
          fail=0
          for path in /AdminApi/users; do
            header=$(curl -sk -I --max-time 5 -- "${BASE}${path}" | grep -i '^www-authenticate' || true)
            if [ -n "$header" ]; then printf '  FAIL %s sent: %s\n' "$path" "$header"; fail=1
            else printf '  ok   %s — no basic-auth header\n' "$path"; fi
          done
          [ $fail -eq 0 ]

      - name: Confirm the build we just tested is still the one deployed
        # Everything above ran against whatever was serving at the time. Runs even when a
        # gate failed so a failure is attributed — but only when the wait step said something
        # landed (keyed on the deploy step, this guard silently disarmed).
        # ONLY rc=3 means takeover; 4/6 are re-read, 5/7 fail as broken invocations.
        if: ${{ !cancelled() && steps.wait.outcome == 'success' }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          rc=0
          for attempt in 1 2 3; do
            rc=0
            node scripts/build-stamp.js --fleet --nodes "$RUNNER_TEMP/nodes.json" --baseline "$RUNNER_TEMP/baseline.json" \
              --expect "$GITHUB_SHA" --expect-run "$GITHUB_RUN_ID" --expect-attempt "$GITHUB_RUN_ATTEMPT" || rc=$?
            [ "$rc" = "0" ] && break
            case "$rc" in 4|6) ;; *) break ;; esac
            echo "  /build unusable (rc=$rc) on attempt $attempt/3 — normal for a few seconds after a roll; re-checking"
            [ "$attempt" != "3" ] && sleep 10
          done
          if [ "$rc" = "0" ]; then
            echo "✅ $TARGET still serving $GITHUB_REF_NAME @ ${GITHUB_SHA:0:7} — the results above describe THIS build"
            exit 0
          fi
          if [ "$rc" != "3" ]; then
            echo "❌ $TARGET could NOT be re-read after the suite (rc=$rc). Not evidence of a takeover; the verification is unattributable."
            exit 1
          fi
          echo "❌ $TARGET is no longer serving the build we just tested — a sibling deploy landed mid-suite."
          echo "   The deploy itself landed. What is void is the VERIFICATION. Re-run when the target is free."
          exit 1
